<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
 <!-- A small temple standing on the pole: three steps, six columns, a pediment.
      Same convention as every other prop here — 100x100 box, object standing on
      y=96, chalk fill #F3EDE1, ink stroke #151A2B. Redraw it in Procreate at
      this size and it drops straight in. -->
 <g fill="none" stroke="#151A2B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">

  <!-- the steps it stands on -->
  <path d="M10 96 L90 96" stroke-width="3.4"/>
  <path d="M13 96 L13 89 L87 89 L87 96" fill="#F3EDE1"/>
  <path d="M17 89 L17 83 L83 83 L83 89" fill="#F3EDE1"/>

  <!-- the floor the columns rise from -->
  <path d="M21 83 L21 78 L79 78 L79 83" fill="#F3EDE1"/>

  <!-- six columns, each with a little fluting -->
  <g stroke-width="2.8">
   <path d="M26 78 L26 40" /><path d="M36 78 L36 40" />
   <path d="M46 78 L46 40" /><path d="M56 78 L56 40" />
   <path d="M66 78 L66 40" /><path d="M74 78 L74 40" />
  </g>
  <g stroke-width="1.4" stroke="#6B7899">
   <path d="M29 74 L29 44" /><path d="M39 74 L39 44" />
   <path d="M49 74 L49 44" /><path d="M59 74 L59 44" />
   <path d="M69 74 L69 44" />
  </g>

  <!-- the beam across the tops of the columns -->
  <path d="M19 40 L81 40 L81 33 L19 33 Z" fill="#F3EDE1"/>

  <!-- the pediment -->
  <path d="M15 33 L50 8 L85 33 Z" fill="#F7E3D2"/>
  <path d="M33 33 L50 21 L67 33" stroke-width="1.8" stroke="#6B7899" fill="none"/>
 </g>
</svg>

